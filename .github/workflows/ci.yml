name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pytest (Python 3.12)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # Dummy env vars so module imports that reference them don't fail.
          # All tests monkeypatch the real network clients, so no Groq/Qdrant
          # calls are made. A real key is never required in CI.
          GROQ_API_KEY: ci-dummy-no-real-calls
          GROQ_MODEL: openai/gpt-oss-120b
          QDRANT_HOST: localhost
          QDRANT_PORT: '6333'
          QDRANT_COLLECTION: arxiv_chunks
        run: PYTHONPATH=src python -m pytest tests/ -v